{{- if .Values.limitRange.enabled }}
apiVersion: v1
kind: LimitRange
metadata:
  name: {{ include "ns.name" . }}-limits
  namespace: {{ include "ns.name" . }}
  labels: {{- include "ns.labels" . | nindent 4 }}
spec:
  limits:
    - type: Container
      defaultRequest: {{- toYaml .Values.limitRange.defaultRequest | nindent 8 }}
      default: {{- toYaml .Values.limitRange.default | nindent 8 }}
      max: {{- toYaml .Values.limitRange.max | nindent 8 }}
{{- end }}
